services:
  kontrakan-app:
    build: .
    container_name: kontrakan_yuyun
    restart: unless-stopped
    ports:
      - "3001:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - APP_USER=admin
      - APP_PASS=nekyuyun2026
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./server.js:/app/server.js
      - ./src:/app/src
      - ./public:/app/public
