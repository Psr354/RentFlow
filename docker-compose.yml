services:
  kontrakan-app:
    build: .
    container_name: kontrakan_yuyun
    restart: unless-stopped
    ports:
      - "3001:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - APP_USER=${APP_USER:-admin}
      - APP_PASS=${APP_PASS:-nekyuyun2026}
      - WA_WEBHOOK_SECRET=${WA_WEBHOOK_SECRET:-}
      - TRUST_PROXY=${TRUST_PROXY:-0}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-}
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
